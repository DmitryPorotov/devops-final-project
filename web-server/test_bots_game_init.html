<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Testing bots</title>
</head>
<body>
<script>
  let websock = null;
  let token = null;
  function send_create_game() {
    websock.send(JSON.stringify({
      type: 'action',
      action: 'create_game',
      lobbyId: 3,
      isRandomHouses: false,
      userId: 1,

    }))
  }
  function doFetch() {
    return fetch('http://127.0.0.1:3001/api/v1/auth/login', {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        email: 'a@b.com',
        password: "12345678"
      })
    })
  }

  function onClick() {
    if (websock) {
      send_create_game();
      return
    }
    doFetch().then(async (data) => {
      const user = await data.json();
      token = user.token;
      websock = new WebSocket(`ws://127.0.0.1:3001/ws?_token=${user.token}`, "events");
      websock.onmessage = (event) => {
        console.log("message:" + event.data);
        const msg = JSON.parse(event.data);
        if (msg.action === 'create_game') {
          websock.send(JSON.stringify({
            type: 'action',
            action: 'fill_with_bots',
            lobbyId: 3,
            userId: 1,
            player_action: {
              houseTypes :[ "lion", "kraken", "moose", "rose", "pufferfish", "wolf"]
            }
          }))
        }
        else if (msg.type === 'chat' && msg.body.type === 'create') {
          send_create_game()
        }
        else if (msg.action === 'get_game_state') {
          document.getElementById('game_state').value = JSON.stringify(msg.gameState, null,  2)
        }
      };
      websock.onopen = (event) => {
        console.log("on open: ", event);
        websock.send(JSON.stringify({
          type: 'chat',
          lobbyId: 3,
          userId: 1,
          body: {
            type: 'create'
          }

        }))
      };
    });
  }
  function onGetState() {
    function getState(id) {
      fetch('http://127.0.0.1:3001/api/v1/admin/games/' + id, {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token,
        },
      }).then(async (msg)=> {
        const json = await msg.json();
        document.getElementById('game_state').value =
              JSON.stringify(json.gameState, null,  2)
      })

    }
    if (!token) doFetch().then(async (data) => {
      const user = await data.json();
      token = user.token;
      getState(3)
    });
    else getState(3)
  }
</script>
  <header>
    <h1>Start bots only game</h1>
    <button onclick="onClick()">Start</button>
    <div>
      <h2>Get game state</h2>
      <button onclick="onGetState()">Get</button>
    </div>
  </header>
  <section>
    <h2>Game state</h2>
    <textarea id="game_state"></textarea>
  </section>
</body>
</html>
