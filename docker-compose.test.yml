services:
  redis:
    profiles:
      - dev
      - infra
      - multi
    image: redis:7.2.2
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    networks:
      - net1
  mysql:
    profiles:
      - dev
      - infra
      - multi
    image: "mysql:8.0.34"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "rootPassword"
      MYSQL_DATABASE: "fwc"
      MYSQL_USER: "bpuser"
      MYSQL_PASSWORD: "123456"
    networks:
      - net1
  web-server:
    profiles:
      - dev
      - multi
    image: "node:18"
    ports: 
      - "3001:80"
      - "9229:9229"
    volumes:
      - "./web-server:/web-server"
    working_dir: "/web-server"
    command: ["npx", "nest", "start", "--debug=0.0.0.0:9229", "--watch"]
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - REDIS_URL=redis://redis:6379
      - SERVER_PORT=80
      - TESTING=true
      - SEVER_NAME=server1
    networks:
      - net1
  web-server2:
    profiles:
      - multi
    image: "node:18"
    ports:
      - "3002:80"
      - "9230:9229"
    volumes:
      - "./web-server:/web-server"
    working_dir: "/web-server"
    command: [ "npx", "nest", "start", "--debug=0.0.0.0:9229", "--watch" ]
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - REDIS_URL=redis://redis:6379
      - SERVER_PORT=80
      - TESTING=true
      - SEVER_NAME=server2
  react:
    profiles:
      - dev
      - infra
      - multi
    image: "node:18"
    ports:
      - "3000:3000"
      - "9228:9228"
    volumes:
      - "./front-login:/front-login"
    working_dir: "/front-login"
    command: ["npm", "run", "start", "--debug=0.0.0.0:9228"]
    networks:
      - net1
  worker:
    profiles:
      - dev
    image: "sbtscala/scala-sbt:eclipse-temurin-jammy-17.0.10_7_1.9.9_2.12.19"
    volumes:
      - "./game-logic-core:/fwc"
    working_dir: "/fwc"
    environment:
      - REDIS_HOST=redis
      - WORKER_NAME=worker1
      - ENVIRONMENT=dev
    command: ["sbt", "run", "--", "-Xrs"]
    networks:
      - net1
    depends_on:
      - redis
  reverse_proxy:
    profiles:
      - dev
      - infra
      - multi
    image: "nginx:1.25.4"
    volumes:
      - ./nginx.conf.d/fwc.conf:/etc/nginx/nginx.conf
      - ./front-defold/build/:/www/data/html
      - ./homepage:/www/data/homepage
    ports:
      - "8888:80"
    networks:
      - net1

networks:
  net1:
