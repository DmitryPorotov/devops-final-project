version: "3"

services:
  rabbitmq:
    image: "rabbitmq:3"
    ports:
      - "5672:5672"
  mysql:
    image: "mysql:8.0.34"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "rootPassword"
      MYSQL_DATABASE: "fwc"
      MYSQL_USER: "bpuser"
      MYSQL_PASSWORD: "123456"
